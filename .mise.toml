[tools]
rust = "1.98.0"

# rustup's minimal profile ships neither clippy nor rustfmt, and which profile a
# machine installed with is not something the pin controls. Adding them is
# idempotent and costs nothing when they are already there.
#
# Every gate depends on this, not only the two that need clippy and rustfmt.
# mise runs tasks in parallel, and rustup installs the pinned toolchain lazily
# on first use, so three cargo processes starting at once each began their own
# download and corrupted each other's partial files. Depending on one task that
# does the rustup work first serialises it.
[tasks.components]
description = "Ensure clippy and rustfmt are present for the pinned toolchain"
run = "rustup component add clippy rustfmt"

[tasks."fmt"]
description = "Format the wctl crate"
depends = ["components"]
dir = "{{config_root}}/cli"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Check formatting of the wctl crate"
depends = ["components"]
dir = "{{config_root}}/cli"
run = "cargo fmt --check"

[tasks.lint]
description = "Clippy with warnings as errors"
depends = ["components"]
dir = "{{config_root}}/cli"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Unit and argument-guard tests (no extension needed)"
depends = ["components"]
dir = "{{config_root}}/cli"
run = "cargo test"

[tasks.build]
description = "Build the release binary"
depends = ["components"]
dir = "{{config_root}}/cli"
run = "cargo build --release"

[tasks.ci]
description = "Everything CI gates on"
depends = ["fmt:check", "lint", "test", "build"]

# The release asset: a static x86_64 binary that runs on any distribution
# without matching a glibc version. CI and release.sh both build it here.
[tasks."build:musl"]
description = "Build the static x86_64 release binary and check its linkage"
depends = ["components"]
dir = "{{config_root}}/cli"
run = [
  "rustup target add x86_64-unknown-linux-musl",
  "cargo build --release --target x86_64-unknown-linux-musl",
  "../scripts/check-static.sh target/x86_64-unknown-linux-musl/release/wctl",
]
