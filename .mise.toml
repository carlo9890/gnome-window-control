[tools]
rust = "1.98.0"

# rustup's minimal profile ships neither clippy nor rustfmt, and which profile a
# machine installed with is not something the pin controls. Adding them is
# idempotent and costs nothing when they are already there.
#
# Every gate depends on this, not only the two that need clippy and rustfmt.
# mise runs tasks in parallel, and rustup installs the pinned toolchain lazily
# on first use, so three cargo processes starting at once each began their own
# download and corrupted each other's partial files. Depending on one task that
# does the rustup work first serialises it.
[tasks.components]
description = "Ensure clippy and rustfmt are present for the pinned toolchain"
run = "rustup component add clippy rustfmt"

[tasks."fmt"]
description = "Format the wctl crate"
depends = ["components"]
dir = "{{config_root}}/cli"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Check formatting of the wctl crate"
depends = ["components"]
dir = "{{config_root}}/cli"
run = "cargo fmt --check"

# --locked on every task that resolves dependencies: a Cargo.lock that
# disagrees with Cargo.toml, as after a version bump without
# `cargo update -p wctl`, fails the task. Without it cargo rewrites the lock in
# place, which CI never sees and which happens after release.sh has checked
# for a clean tree, so the tag ships the stale lock.
[tasks.lint]
description = "Clippy with warnings as errors"
depends = ["components"]
dir = "{{config_root}}/cli"
run = "cargo clippy --locked --all-targets -- -D warnings"

[tasks.test]
description = "Unit and argument-guard tests (no extension needed)"
depends = ["components"]
dir = "{{config_root}}/cli"
run = "cargo test --locked"

# --target-dir, as build:musl has: install-wctl.sh --local and the shell suites
# take cli/target/release/wctl.
[tasks.build]
description = "Build the release binary"
depends = ["components"]
dir = "{{config_root}}/cli"
run = "cargo build --release --locked --target-dir target"

# It fetches the advisory database on each run, so it needs the network, and a
# new advisory can fail it with no change here.
#
# The pin is on the task, not in [tools], so a source build of wctl does not
# download cargo-audit. The mise registry has no cargo-audit; its release tags
# carry this prefix.
[tasks.audit]
description = "Check the dependencies against the RustSec advisory database"
depends = ["components"]
tools = { "github:rustsec/rustsec" = { version = "0.23.0", version_prefix = "cargo-audit/v", bin = "cargo-audit" } }
dir = "{{config_root}}/cli"
run = "cargo-audit audit --deny warnings"

[tasks.ci]
description = "Everything CI gates on"
depends = ["fmt:check", "lint", "test", "build", "audit"]

# The release asset: a static x86_64 binary that runs on any distribution
# without matching a glibc version. CI and release.sh both build it here.
#
# --target-dir, because release.sh and CI take the binary from cli/target: with
# CARGO_TARGET_DIR or build.target-dir set, cargo would write it elsewhere and
# leave an older build there to be checked and published.
[tasks."build:musl"]
description = "Build the static x86_64 release binary and check its linkage"
depends = ["components"]
dir = "{{config_root}}/cli"
run = [
  "rustup target add x86_64-unknown-linux-musl",
  "cargo build --release --locked --target x86_64-unknown-linux-musl --target-dir target",
  "../scripts/check-static.sh target/x86_64-unknown-linux-musl/release/wctl",
]
