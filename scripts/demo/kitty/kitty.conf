# The kitty config of every window a demo scene opens (record.sh points
# KITTY_CONFIG_DIRECTORY here). Colors: Catppuccin Mocha.

shell bash --norc --noprofile
shell_integration disabled
env PS1=\[\e[38;2;203;166;247m\]❯\[\e[0m\]
confirm_os_window_close 0
remember_window_size no
initial_window_width 600
initial_window_height 340
window_padding_width 12
wayland_titlebar_color background
cursor_blink_interval 0

font_family JetBrains Mono
font_size 14

foreground #cdd6f4
background #1e1e2e
cursor #f5e0dc
selection_background #585b70
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #cba6f7
color6 #94e2d5
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #94e2d5
color15 #a6adc8
