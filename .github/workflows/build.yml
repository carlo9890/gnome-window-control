name: Build Extension

on:
  push:
    branches: [main]
    paths:
      - 'window-control@hko9890/**'
      - 'scripts/**'
      - 'wctl'
      - 'install-wctl.sh'
      - 'tests/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'window-control@hko9890/**'
      - 'scripts/**'
      - 'wctl'
      - 'install-wctl.sh'
      - 'tests/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check extension JavaScript syntax (node --check)
        run: |
          for js in window-control@hko9890/*.js; do
            echo "node --check $js"
            node --check "$js"
          done

      - name: Run pure-logic tests (no extension required)
        run: |
          chmod +x wctl tests/*.sh
          bash tests/test-logic.sh

      - name: Make build script executable
        run: chmod +x scripts/build.sh

      - name: Build extension
        run: ./scripts/build.sh all

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: window-control-extension
          path: dist/*.zip
          retention-days: 30

      - name: Upload wctl artifact
        uses: actions/upload-artifact@v4
        with:
          name: wctl
          path: wctl
          retention-days: 30

      - name: Upload install script artifact
        uses: actions/upload-artifact@v4
        with:
          name: install-wctl
          path: install-wctl.sh
          retention-days: 30
