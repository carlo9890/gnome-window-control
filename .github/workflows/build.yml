name: Build Extension

on:
  push:
    branches: [main]
    paths:
      - 'window-control@carlo9890.github.io/**'
      - 'cli/**'
      - '.mise.toml'
      - 'scripts/**'
      - 'install-wctl.sh'
      - 'tests/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'window-control@carlo9890.github.io/**'
      - 'cli/**'
      - '.mise.toml'
      - 'scripts/**'
      - 'install-wctl.sh'
      - 'tests/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check extension JavaScript syntax (node --check)
        run: |
          for js in window-control@carlo9890.github.io/*.js; do
            echo "node --check $js"
            node --check "$js"
          done

      - name: Make build script executable
        run: chmod +x scripts/build.sh

      - name: Build extension
        run: ./scripts/build.sh all

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: window-control-extension
          path: dist/*.zip
          retention-days: 30

      - name: Upload install script artifact
        uses: actions/upload-artifact@v4
        with:
          name: install-wctl
          path: install-wctl.sh
          retention-days: 30

  cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: jdx/mise-action@v2

      # Formatting, clippy (warnings are errors), unit tests, argument-guard
      # tests and the release build. None of it needs a GNOME session: every
      # test case fails before wctl opens the session bus.
      - name: Run the CLI gates
        run: mise run ci

      - name: Upload wctl artifact
        uses: actions/upload-artifact@v4
        with:
          name: wctl
          path: cli/target/release/wctl
          retention-days: 30
