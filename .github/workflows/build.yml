name: Build Extension

on:
  push:
    branches: [main]
    paths:
      - 'window-control@carlo9890.github.io/**'
      - 'cli/**'
      - '.mise.toml'
      - 'scripts/**'
      - 'install-wctl.sh'
      - 'tests/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'window-control@carlo9890.github.io/**'
      - 'cli/**'
      - '.mise.toml'
      - 'scripts/**'
      - 'install-wctl.sh'
      - 'tests/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check extension JavaScript syntax (node --check)
        run: |
          for js in window-control@carlo9890.github.io/*.js; do
            echo "node --check $js"
            node --check "$js"
          done

      # The rules.json grammar, pinned to tests/vectors/rules-spec.json -- the
      # same vectors the crate's rules_spec_vectors test reads, which is what
      # keeps the GJS and the Rust validator from drifting apart.
      #
      # rules-format.js imports nothing, so plain gjs loads it without the
      # mutter typelib. It runs before the typelib is installed, and
      # GI_TYPELIB_PATH is unset explicitly, so a stray gi:// import fails here.
      - name: Install gjs
        run: sudo apt-get update && sudo apt-get install -y gjs

      - name: Check the rules.json grammar against the shared vectors
        run: env -u GI_TYPELIB_PATH gjs -m tests/check-rules-format.js

      # extension.js, rules.js and keybindings.js import gi://Meta, so this
      # check needs the mutter typelib. The package name carries the mutter
      # API version (gir1.2-mutter-14 on Ubuntu 24.04), so take the newest
      # one the runner image has.
      - name: Install the mutter typelib
        run: |
          pkg=$(apt-cache search --names-only '^gir1\.2-mutter-[0-9]+$' | cut -d' ' -f1 | sort -V | tail -1)
          # apt-get install "" installs nothing and exits 0.
          if [ -z "$pkg" ]; then
            echo "no gir1.2-mutter-<N> package on this runner image" >&2
            exit 1
          fi
          sudo apt-get install -y "$pkg"

      - name: Check the extension against fake windows (no shell)
        run: |
          GI_TYPELIB_PATH=$(dirname "$(find /usr/lib* -name 'Meta-*.typelib' | head -1)") \
            gjs -m tests/check-extension-headless.js

      - name: Make build script executable
        run: chmod +x scripts/build.sh

      - name: Build extension
        run: ./scripts/build.sh all

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: window-control-extension
          path: dist/*.zip
          retention-days: 30

      - name: Upload install script artifact
        uses: actions/upload-artifact@v4
        with:
          name: install-wctl
          path: install-wctl.sh
          retention-days: 30

  cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install the pinned toolchain
        uses: jdx/mise-action@v2

      # Formatting, clippy (warnings are errors), unit tests, argument-guard
      # tests and the release build. None of it needs a GNOME session: every
      # test case fails before wctl opens the session bus.
      - name: Run the CLI gates
        run: mise run ci

      - name: Upload wctl artifact
        uses: actions/upload-artifact@v4
        with:
          name: wctl
          path: cli/target/release/wctl
          retention-days: 30
